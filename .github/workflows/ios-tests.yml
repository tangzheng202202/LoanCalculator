name: iOS tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode
        run: xcodebuild -version
      - name: Build app and run unit tests
        run: |
          xcodebuild test \
            -project LoanCalculator.xcodeproj \
            -scheme LoanCalculator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
            -only-testing:LoanCalculatorTests \
            CODE_SIGNING_ALLOWED=NO
